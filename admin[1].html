<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — StudyTrack</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><main class="main" style="margin-left:0;width:100%"><div class="topbar"><div><h1>StudyTrack Admin</h1><p>Management data akademik mahasiswa.</p></div><button class="btn" onclick="location.href='index.html'">Kembali ke aplikasi</button></div><div class="grid grid-3"><div class="card metric"><span class="eyebrow">Mahasiswa</span><div class="value" id="students">—</div></div><div class="card metric"><span class="eyebrow">Mata kuliah</span><div class="value" id="courses">—</div></div><div class="card metric"><span class="eyebrow">Tugas</span><div class="value" id="tasks">—</div></div></div><div class="card" style="margin-top:18px"><h2>Status</h2><p class="muted">Halaman admin dasar. Hak akses produksi sebaiknya menggunakan role/profile + RLS sebelum dibuka untuk pengguna umum.</p></div></main><script>
(async()=>{const {data:{user}}=await supabaseClient.auth.getUser();if(!user){location.href="login.html";return}const a=await Promise.all([supabaseClient.from("profiles").select("id"),supabaseClient.from("courses").select("id"),supabaseClient.from("assignments").select("id")]);students.textContent=a[0].data?.length||0;courses.textContent=a[1].data?.length||0;tasks.textContent=a[2].data?.length||0})()
</script></body></html>
