<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar — StudyTrack</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><main class="auth-page"><section class="auth-card"><div class="brand"><div class="brand-mark">ST</div><div><strong>StudyTrack</strong><small>STIKOM Tunas Bangsa</small></div></div><h1>Buat akun mahasiswa</h1><p>Mulai catat jadwal, tugas, nilai, dan target Cumlaude.</p><form id="registerForm" class="form"><div class="field"><label>Nama lengkap</label><input name="full_name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="form-grid"><div class="field"><label>Program studi</label><select name="prodi"><option value="TI">Teknik Informatika</option><option value="SI">Sistem Informasi</option></select></div><div class="field"><label>Semester</label><select name="semester">${Array.from({length:8},(_,i)=>`<option>${i+1}</option>`).join("")}</select></div></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><button class="btn primary" type="submit">Buat akun</button></form><p style="text-align:center;margin-top:18px">Sudah punya akun? <a href="login.html" style="color:var(--green-dark);font-weight:800">Masuk</a></p><div id="msg" class="muted"></div></section></main><script>
const sb=supabaseClient;
registerForm.onsubmit=async(e)=>{e.preventDefault();msg.textContent="Mendaftarkan...";const f=new FormData(e.target);const {data,error}=await sb.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{full_name:f.get("full_name")}}});if(error){msg.textContent=error.message;return}if(data.user){const {error:pErr}=await sb.from("profiles").upsert({id:data.user.id,email:f.get("email"),full_name:f.get("full_name"),prodi:f.get("prodi"),semester:Number(f.get("semester")),target_ipk:4,cumlaude_threshold:3.51});if(pErr)msg.textContent=pErr.message;else {msg.textContent="Akun berhasil dibuat. Jika email confirmation aktif, cek email Anda.";setTimeout(()=>location.href="login.html",1200)}}};
</script></body></html>
