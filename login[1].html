<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — StudyTrack</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase.js"></script></head><body><main class="auth-page"><section class="auth-card"><div class="brand"><div class="brand-mark">ST</div><div><strong>StudyTrack</strong><small>STIKOM Tunas Bangsa</small></div></div><h1>Selamat datang 👋</h1><p>Masuk untuk mengelola perjalanan akademikmu.</p><form id="loginForm" class="form"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="nama@email.com"></div><div class="field"><label>Password</label><input name="password" type="password" required placeholder="••••••••"></div><button class="btn primary" type="submit">Masuk</button></form><p style="text-align:center;margin-top:18px">Belum punya akun? <a href="register.html" style="color:var(--green-dark);font-weight:800">Daftar</a></p><div id="msg" class="muted"></div></section></main><script>
const sb=supabaseClient;
loginForm.onsubmit=async(e)=>{e.preventDefault();msg.textContent="Memproses...";const f=new FormData(e.target);const {error}=await sb.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error){msg.textContent=error.message}else location.href="index.html"};
</script></body></html>
